<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departures | Hotel Group Booking Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="departures">
<div id="hgbms-root" class="app-wrapper"></div>
<div id="page-content">
  <div class="page-header d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div><nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item active">Departures</li></ol></nav>
      <h1 class="page-title">Departures</h1><p class="page-subtitle">Group check-out schedule — Saturday, 27 June 2026.</p></div>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" data-export><i class="bi bi-download"></i> Export</button></div>
  </div>
  <div class="row g-3 mb-4">
    <div class="col-md-6"><div class="stat-card text-center border-start border-4 border-warning"><div class="stat-card-value fs-3">4</div><div class="stat-card-label">Today's Check-outs</div><div class="small text-secondary">108 rooms · 200 pax</div></div></div>
    <div class="col-md-6"><div class="stat-card text-center"><div class="stat-card-value fs-3">6</div><div class="stat-card-label">Upcoming Departures</div><div class="small text-secondary">192 rooms · 354 pax</div></div></div>
  </div>
  <ul class="nav nav-tabs nav-tabs-custom mb-4"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#depToday">Today's Check-out</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#depUpcoming">Upcoming</button></li></ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="depToday"><div class="card"><div class="card-header"><i class="bi bi-box-arrow-right me-2 text-warning"></i>Today — 27 Jun 2026</div>
      <div class="table-wrapper"><table class="table table-hover mb-0"><thead><tr><th>Ref</th><th>Group</th><th>Hotel</th><th>Agency</th><th>Departure</th><th>Rooms</th><th>Pax</th><th>Status</th></tr></thead><tbody id="todayDeparturesBody"></tbody></table></div></div></div>
    <div class="tab-pane fade" id="depUpcoming"><div class="card"><div class="card-header">Upcoming Departures</div>
      <div class="table-wrapper"><table class="table table-hover mb-0"><thead><tr><th>Ref</th><th>Group</th><th>Hotel</th><th>Agency</th><th>Departure</th><th>Rooms</th><th>Pax</th><th>Status</th></tr></thead><tbody id="upcomingDeparturesBody"></tbody></table></div></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/render.js"></script><script src="assets/js/app.js"></script>
</body></html>
