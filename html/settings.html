<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Hotel Group Booking Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<div id="hgbms-root" class="app-wrapper"></div>
<div id="page-content">
  <div class="page-header mb-4">
    <nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item active">Settings</li></ol></nav>
    <h1 class="page-title">Settings</h1><p class="page-subtitle">System configuration and preferences.</p>
  </div>
  <div class="row g-4 settings-layout">
    <div class="col-lg-3"><div class="list-group">
      <button class="list-group-item list-group-item-action active" data-bs-toggle="tab" data-bs-target="#setCompany">Company Details</button>
      <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#setHotel">Hotel Settings</button>
      <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#setEmail">Email Settings</button>
      <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#setGeneral">General Settings</button>
    </div></div>
    <div class="col-lg-9"><div class="tab-content">
      <div class="tab-pane fade show active" id="setCompany"><div class="card"><div class="card-header">Company Details</div><div class="card-body"><form class="row g-3">
        <div class="col-md-8"><div class="form-floating"><input type="text" class="form-control" value="Heritage Hotel Group Ltd"><label>Company Name</label></div></div>
        <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" value="08472931"><label>Company Number</label></div></div>
        <div class="col-12"><div class="form-floating"><input type="text" class="form-control" value="45 Berkeley Square, London, W1J 5AZ"><label>Registered Address</label></div></div>
        <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" value="GB 123 4567 89"><label>VAT Number</label></div></div>
        <div class="col-md-4"><div class="form-floating"><input type="tel" class="form-control" value="+44 20 7946 0958"><label>Phone</label></div></div>
        <div class="col-md-4"><div class="form-floating"><input type="email" class="form-control" value="info@hotelgroup.co.uk"><label>Email</label></div></div>
        <div class="col-12"><button type="button" class="btn btn-accent">Save Changes</button></div>
      </form></div></div></div>
      <div class="tab-pane fade" id="setHotel"><div class="card"><div class="card-header">Hotel Settings</div><div class="card-body"><div class="row g-3">
        <div class="col-md-6"><label class="form-label fw-semibold">Default Check-in Time</label><input type="time" class="form-control" value="15:00"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Default Check-out Time</label><input type="time" class="form-control" value="10:00"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Rooming List Deadline (days before arrival)</label><input type="number" class="form-control" value="7"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Default Meal Plan</label><select class="form-select"><option>Half Board (HB)</option><option>Bed & Breakfast (BB)</option><option>Full Board (FB)</option></select></div>
        <div class="col-12"><button type="button" class="btn btn-accent">Save Changes</button></div>
      </div></div></div></div>
      <div class="tab-pane fade" id="setEmail"><div class="card"><div class="card-header">Email Settings</div><div class="card-body"><div class="row g-3">
        <div class="col-md-6"><div class="form-floating"><input type="email" class="form-control" value="bookings@hotelgroup.co.uk"><label>From Email</label></div></div>
        <div class="col-md-6"><div class="form-floating"><input type="text" class="form-control" value="Hotel Group Bookings"><label>From Name</label></div></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked id="emailConfirm"><label class="form-check-label" for="emailConfirm">Send booking confirmation emails</label></div></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked id="emailReminder"><label class="form-check-label" for="emailReminder">Send arrival reminder emails (7 days prior)</label></div></div>
        <div class="col-12"><button type="button" class="btn btn-accent">Save Changes</button></div>
      </div></div></div></div>
      <div class="tab-pane fade" id="setGeneral"><div class="card"><div class="card-header">General Settings</div><div class="card-body"><div class="row g-3">
        <div class="col-md-4"><label class="form-label fw-semibold">Currency</label><select class="form-select"><option selected>GBP (£)</option><option>EUR (€)</option></select></div>
        <div class="col-md-4"><label class="form-label fw-semibold">Date Format</label><select class="form-select"><option selected>DD/MM/YYYY</option><option>MM/DD/YYYY</option></select></div>
        <div class="col-md-4"><label class="form-label fw-semibold">Timezone</label><select class="form-select"><option selected>Europe/London (GMT/BST)</option></select></div>
        <div class="col-md-4"><label class="form-label fw-semibold">Financial Year Start</label><select class="form-select"><option selected>January</option><option>April</option></select></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked id="darkReady"><label class="form-check-label" for="darkReady">Enable dark mode option</label></div></div>
        <div class="col-12"><button type="button" class="btn btn-accent">Save Changes</button></div>
      </div></div></div></div>
    </div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/app.js"></script>
</body></html>
