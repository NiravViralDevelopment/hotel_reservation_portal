<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companies | Hotel Group Booking Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="companies">
<div id="hgbms-root" class="app-wrapper"></div>
<div id="page-content">
  <div class="page-header d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div><nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item active">Companies</li></ol></nav>
      <h1 class="page-title">Companies</h1><p class="page-subtitle">Parent companies and hotel group entities — 8 registered companies.</p></div>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" data-refresh><i class="bi bi-arrow-clockwise"></i> Refresh</button><button class="btn btn-outline-secondary btn-sm" data-export><i class="bi bi-download"></i> Export</button><button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#addCompanyModal"><i class="bi bi-plus-lg"></i> Add Company</button></div>
  </div>
  <div class="card">
    <div class="table-toolbar">
      <div class="input-group search-input"><span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span><input type="search" class="form-control border-start-0 table-search" placeholder="Search companies…" data-table="companiesTable"></div>
      <select class="form-select form-select-sm" style="width:auto"><option>All Statuses</option><option>Active</option><option>Inactive</option></select>
      <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#filtersOffcanvas"><i class="bi bi-funnel"></i> Filters</button>
    </div>
    <div class="table-wrapper"><table class="table table-hover" id="companiesTable" data-sortable><thead><tr>
      <th data-sort>Company Name</th><th data-sort>Reg. Number</th><th data-sort>City</th><th data-sort>Country</th>
      <th data-sort class="text-center">Hotels</th><th data-sort class="text-center">Contacts</th><th data-sort>Revenue</th><th data-sort>Status</th><th>Actions</th>
    </tr></thead><tbody id="companiesTableBody"></tbody></table></div>
    <div class="table-footer"><span>Showing <strong>1</strong> to <strong>8</strong> of <strong>8</strong> entries</span></div>
  </div>
  <div class="modal fade" id="addCompanyModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add Company</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-8"><div class="form-floating"><input type="text" class="form-control" placeholder="Name"><label>Company Name</label></div></div>
      <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" placeholder="Reg"><label>Registration Number</label></div></div>
      <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control"><label>City</label></div></div>
      <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" value="United Kingdom"><label>Country</label></div></div>
      <div class="col-md-4"><div class="form-floating"><select class="form-select"><option>Active</option><option>Inactive</option></select><label>Status</label></div></div>
    </div></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-accent" data-bs-dismiss="modal">Save Company</button></div>
  </div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/render.js"></script><script src="assets/js/app.js"></script>
</body></html>
