<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Hotel Group Booking Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="calendar">
<div id="hgbms-root" class="app-wrapper"></div>
<div id="page-content">
  <div class="page-header d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div><nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item active">Calendar</li></ol></nav>
      <h1 class="page-title">Booking Calendar</h1><p class="page-subtitle">June 2026 — arrivals, departures, and group occupancy.</p></div>
    <div class="d-flex gap-2 align-items-center">
      <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-chevron-left"></i></button>
      <span class="fw-semibold">June 2026</span>
      <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div>
  <ul class="nav nav-tabs nav-tabs-custom mb-4"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#calBookings">Booking Calendar</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#calArrivals">Arrival Calendar</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#calDepartures">Departure Calendar</button></li></ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="calBookings">
      <div class="card mb-3"><div class="card-body py-2 d-flex gap-3 flex-wrap small">
        <span><span class="calendar-event d-inline-block">Arrival</span> Group check-in</span>
        <span><span class="calendar-event departure d-inline-block">Departure</span> Group check-out</span>
        <span><span class="badge-status badge-confirmed">In-house</span> Active stay</span>
      </div></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div class="tab-pane fade" id="calArrivals"><div class="card"><div class="card-body"><div class="calendar-grid" id="arrivalCalendarGrid"></div></div></div></div>
    <div class="tab-pane fade" id="calDepartures"><div class="card"><div class="card-body"><div class="calendar-grid" id="departureCalendarGrid"></div></div></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/render.js"></script><script src="assets/js/app.js"></script>
<script>
document.addEventListener('hgbms:layout-ready', function() {
  var days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var events = { 27: [{t:'Coastal Explorer', type:'arr'},{t:'Highland Heritage',type:'arr'}], 28: [{t:'Cotswolds Discovery',type:'arr'},{t:'Peak District',type:'dep'}], 29: [{t:'Whisky Trail',type:'arr'},{t:'Roman Britain',type:'dep'}], 30: [{t:'Coastal Explorer',type:'dep'},{t:'Lake District',type:'arr'}] };
  function buildCal(id, filter) {
    var el = document.getElementById(id); if (!el) return;
    var html = days.map(function(d){ return '<div class="calendar-day-header">'+d+'</div>'; }).join('');
    for (var i = 0; i < 35; i++) {
      var day = i - 0 + 1;
      var inMonth = day >= 1 && day <= 30;
      var d = inMonth ? day : (day < 1 ? 31+day : day-30);
      var cls = inMonth ? '' : ' other-month';
      html += '<div class="calendar-day'+cls+'"><div class="calendar-day-number">'+d+'</div>';
      if (inMonth && events[d]) events[d].forEach(function(ev) {
        if (!filter || filter === ev.type) html += '<div class="calendar-event'+(ev.type==='dep'?' departure':'')+'">'+ev.t+'</div>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
  }
  buildCal('calendarGrid');
  buildCal('arrivalCalendarGrid', 'arr');
  buildCal('departureCalendarGrid', 'dep');
});
</script>
</body></html>
