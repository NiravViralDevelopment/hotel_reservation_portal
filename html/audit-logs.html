<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs | Hotel Group Booking Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="audit">
<div id="hgbms-root" class="app-wrapper"></div>
<div id="page-content">
  <div class="page-header d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div><nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="dashboard.html">Home</a></li><li class="breadcrumb-item active">Audit Logs</li></ol></nav>
      <h1 class="page-title">Audit Logs</h1><p class="page-subtitle">Complete activity trail for compliance and security.</p></div>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" data-export><i class="bi bi-download"></i> Export</button></div>
  </div>
  <div class="card">
    <div class="table-toolbar">
      <div class="input-group search-input"><span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span><input type="search" class="form-control border-start-0 table-search" placeholder="Search logs…" data-table="auditTable"></div>
      <select class="form-select form-select-sm" style="width:auto"><option>All Modules</option><option>Group Bookings</option><option>Enquiries</option><option>Finance</option><option>Authentication</option></select>
      <input type="date" class="form-control form-control-sm" style="width:auto" value="2026-06-27">
    </div>
    <div class="table-wrapper"><table class="table table-hover table-sm" id="auditTable" data-sortable><thead><tr>
      <th data-sort>Timestamp</th><th data-sort>User</th><th data-sort>Action</th><th data-sort>Module</th><th data-sort>Details</th><th data-sort>IP Address</th>
    </tr></thead><tbody id="auditTableBody"></tbody></table></div>
    <div class="table-footer"><span>Showing <strong>1</strong> to <strong>8</strong> of <strong>1,247</strong> entries</span>
      <nav><ul class="pagination pagination-sm mb-0"><li class="page-item active"><a class="page-link">1</a></li><li class="page-item"><a class="page-link">2</a></li><li class="page-item"><a class="page-link">Next</a></li></ul></nav>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/render.js"></script><script src="assets/js/app.js"></script>
